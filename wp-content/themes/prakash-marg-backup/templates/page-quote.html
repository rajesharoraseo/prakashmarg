<!-- wp:html -->
<main class="pm-quote-page" style="background:var(--iv);min-height:100vh;padding-bottom:60px">

<!-- Hero Section -->
<div style="background:var(--gd);padding:50px 0 40px;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background:url('data:image/svg+xml,%3Csvg width=\'40\' height=\'40\' viewBox=\'0 0 40 40\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M20 20.5V18H0v-2h20v-2.5L25 17l-5 3.5zM20 38.5V36H0v-2h20v-2.5L25 35l-5 3.5z\' fill=\'%23ffffff\' fill-opacity=\'0.03\' fill-rule=\'evenodd\'/%3E%3C/svg%3E') repeat;"></div>
  <div class="container" style="position:relative;z-index:1;text-align:center">
    <span style="font-size:12px;font-weight:700;color:var(--gol);text-transform:uppercase;letter-spacing:.1em">दैनिक प्रेरणा</span>
    <h1 style="font-family:'Tiro Devanagari Hindi',serif;font-size:42px;font-weight:700;color:#fff;margin:12px 0 16px">आज का सुविचार</h1>
    <p style="color:rgba(255,255,255,.8);font-size:16px;max-width:500px;margin:0 auto">प्राचीन ग्रन्थों, उपनिषदों और महापुरुषों की वाणी से जीवन को दिशा देने वाले अनमोल विचार।</p>
  </div>
</div>

<!-- Main Content -->
<div class="container" style="margin-top:-20px;position:relative;z-index:2;display:grid;grid-template-columns:1fr 300px;gap:30px">
  
  <div>
    <!-- Quote of the Day (Big) -->
    <div id="pm-qotd-container" style="background:#fff;border-radius:24px;padding:40px;box-shadow:0 10px 30px rgba(0,0,0,.05);text-align:center;margin-bottom:30px;border:1px solid var(--bdl)">
      <div style="font-size:48px;line-height:1;color:var(--gd);opacity:.2;margin-bottom:10px">❝</div>
      <h2 id="pm-qotd-text" style="font-family:'Tiro Devanagari Hindi',serif;font-size:28px;line-height:1.4;color:var(--gd);margin-bottom:20px;font-weight:700">लोड हो रहा है...</h2>
      <p id="pm-qotd-trans" style="font-size:16px;color:var(--txm);margin-bottom:24px;line-height:1.6"></p>
      <div style="display:inline-block;padding:8px 16px;background:var(--sg);border-radius:12px;font-weight:600;color:var(--gm);font-size:14px" id="pm-qotd-source">...</div>
      
      <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--bdl);display:flex;justify-content:center;gap:12px">
        <button onclick="shareQOTD()" style="background:var(--gd);color:#fff;border:none;padding:10px 24px;border-radius:12px;font-weight:600;font-family:'Mukta',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          शेयर करें
        </button>
        <button onclick="randomQuote()" style="background:var(--sg);color:var(--gd);border:none;padding:10px 24px;border-radius:12px;font-weight:600;font-family:'Mukta',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/><path d="M3.51 15A9 9 0 0 0 18.36 18.36L23 14"/></svg>
          नया सुविचार
        </button>
      </div>
    </div>

    <!-- List of All Quotes -->
    <h3 style="font-size:20px;font-weight:700;color:var(--gd);margin:40px 0 20px;padding-left:10px;border-left:4px solid var(--go)">सभी सुविचार व श्लोक</h3>
    <div id="pm-all-quotes" style="display:grid;gap:16px"></div>
  </div>

  <!-- Sidebar -->
  <aside>
    <!-- Daily Wisdom widget block (reused logic) -->
    <!-- wp:pm/daily-wisdom /-->
    
    <!-- wp:latest-posts {"postsToShow":3,"displayPostDate":true,"displayFeaturedImage":true,"featuredImageAlign":"left","featuredImageSizeSlug":"thumbnail","className":"pm-sidebar-latest"} /-->
  </aside>
</div>

<script>
(function(){
  const ALL_QUOTES = [
    { text: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि।।", trans: 'कर्म करना तुम्हारा अधिकार है, फल की चिंता मत करो।', source: 'भगवद्गीता 2.47' },
    { text: 'सत्यमेव जयते नानृतं।', trans: 'सत्य की सदा विजय होती है, असत्य की नहीं।', source: 'मुण्डक उपनिषद 3.1.6' },
    { text: 'सर्वे भवन्तु सुखिनः। सर्वे सन्तु निरामयाः।', trans: 'सभी सुखी हों, सभी रोगमुक्त हों, किसी को दुख न हो।', source: 'बृहदारण्यक उपनिषद' },
    { text: "ॐ असतो मा सद्गमय।\nतमसो मा ज्योतिर्गमय।\nमृत्योर्मा अमृतं गमय।", trans: 'अंधकार से प्रकाश की ओर, मृत्यु से अमरता की ओर ले चलो।', source: 'बृहदारण्यक उपनिषद 1.3.28' },
    { text: 'ढाई आखर प्रेम का, पढ़े सो पण्डित होय।', trans: 'जो प्रेम के ढाई अक्षर पढ़ ले, वही सच्चा विद्वान है।', source: 'कबीर दास' },
    { text: 'मन के हारे हार है, मन के जीते जीत।', trans: 'मन से हारना सच्ची हार है और मन से जीतना सच्ची जीत।', source: 'कबीर दास' },
    { text: 'अपना दीपक स्वयं बनो।', trans: 'अपना मार्गदर्शन स्वयं करो, दूसरों पर निर्भर मत रहो।', source: 'गौतम बुद्ध' },
    { text: 'विद्या विनयेन शोभते।', trans: 'विद्या विनम्रता से शोभती है।', source: 'चाणक्य' },
    { text: 'यत्र नार्यस्तु पूज्यन्ते, रमन्ते तत्र देवताः।', trans: 'जहाँ नारी का सम्मान होता है, वहाँ देवता निवास करते हैं।', source: 'मनुस्मृति 3.56' },
    { text: 'सेवा परमो धर्मः।', trans: 'सेवा ही सबसे बड़ा धर्म है।', source: 'महाभारत' },
    { text: 'उत्तिष्ठत जाग्रत प्राप्य वरान्निबोधत।', trans: 'उठो, जागो, और तब तक मत रुको जब तक लक्ष्य की प्राप्ति न हो जाए।', source: 'कठोपनिषद (स्वामी विवेकानंद द्वारा लोकप्रिय)' },
    { text: 'अहिंसा परमो धर्मः।', trans: 'अहिंसा सबसे बड़ा धर्म है।', source: 'महाभारत' }
  ];

  let currentQuote = null;

  function setQOTD(q) {
    currentQuote = q;
    document.getElementById('pm-qotd-text').innerText = q.text;
    document.getElementById('pm-qotd-trans').innerText = q.trans;
    document.getElementById('pm-qotd-source').innerText = q.source;
  }

  window.randomQuote = function() {
    let q = ALL_QUOTES[Math.floor(Math.random() * ALL_QUOTES.length)];
    // Ensure we get a new one
    while (q === currentQuote && ALL_QUOTES.length > 1) {
      q = ALL_QUOTES[Math.floor(Math.random() * ALL_QUOTES.length)];
    }
    setQOTD(q);
  };

  window.shareQOTD = function() {
    if (navigator.share && currentQuote) {
      navigator.share({
        title: 'आज का सुविचार',
        text: currentQuote.text + '\n— ' + currentQuote.source + '\n\n' + currentQuote.trans,
        url: window.location.href
      });
    } else {
      alert("Sharing is not supported on this browser.");
    }
  };

  document.addEventListener('DOMContentLoaded', function() {
    // Set daily quote based on day of year
    let dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
    setQOTD(ALL_QUOTES[dayOfYear % ALL_QUOTES.length]);

    // Render list
    const listEl = document.getElementById('pm-all-quotes');
    if (listEl) {
      listEl.innerHTML = ALL_QUOTES.map(q => `
        <div style="background:#fff;border:1px solid var(--bdl);border-radius:16px;padding:24px;transition:all .2s" onmouseover="this.style.borderColor='var(--go)'" onmouseout="this.style.borderColor='var(--bdl)'">
          <p style="font-family:'Tiro Devanagari Hindi',serif;font-size:20px;font-weight:700;color:var(--gd);margin-bottom:12px;line-height:1.4;white-space:pre-line">${q.text}</p>
          <p style="font-size:15px;color:var(--tx);margin-bottom:12px">${q.trans}</p>
          <span style="font-size:12px;font-weight:600;color:var(--txm);text-transform:uppercase">${q.source}</span>
        </div>
      `).join('');
    }
  });

})();
</script>
<!-- /wp:html -->
